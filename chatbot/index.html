<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-2xl flex flex-col overflow-hidden h-[80vh]">
        <div class="bg-blue-600 p-4 text-white text-lg font-semibold shadow-md">
            🤖 AI Assistant
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50">
            <div class="text-left"><span class="bg-gray-200 text-gray-700 p-3 rounded-2xl inline-block shadow-sm">Hello!
                    How can I help you today?</span></div>
        </div>

        <div class="p-4 border-t bg-white flex items-center gap-2">
            <input type="text" id="user-input" placeholder="Ask me anything..."
                class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="sendMessage()" id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full transition-all px-6 font-medium">
                Send
            </button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input')
            const chatBox = document.getElementById('chat-box')
            const btn = document.getElementById('send-btn')

            if (!input.value.trim()) return;

            const userText = input.value;
            input.value = ""

            // userUI
            chatBox.innerHTML += `
            <div class="flex justify-end" > <span class="bg-blue-200 text-blue-800 p-3 rounded-2xl inline-block shadow-sm max-w-[80%] ">${userText}</span> </div>

            `

            // loadingUI
            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="flex justify-start"> <span class="bg-gray-200 text-gray-700 p-3 rounded-2xl inline-block shadow-sm max-w-[80%]">Loading...</span> </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {

                const response = await fetch('http://localhost:3000/chat', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userText })
                })
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.reply) {
                    chatBox.innerHTML += `<div class="text-left"><span class="bg-gray-200 text-gray-700 p-3 rounded-2xl inline-block shadow-sm">${data.reply}</span></div>`
                } else {
                    chatBox.innerHTML += `<div class="text-left"><span class="bg-red-200 text-red-800 p-3 rounded-2xl inline-block shadow-sm">${data.error}</span></div>`
                }
                chatBox.scrollTop = chatBox.scrollHeight;

            }
            catch (err) {
                document.getElementById("loadingId").remove();
                chatBox.innerHTML += `<div>Server not Connected! Run 'node server.js'</div>`

            }


        }
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key == "Enter") sendMessage();
        })

    </script>
</body>

</html>
